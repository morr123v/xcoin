name: pentest-ai Live Debug Session (SSH + Tailscale)

on:
  workflow_dispatch:
    inputs:
      debug_target:
        description: '(Optional) Target IP or hostname inside Tailnet to test connectivity'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  # Step 1: Secure Tunnel හදන Job එක
  connect-via-tailscale:
    name: Establish Secure SSH Tunnel
    runs-on: ubuntu-latest
    env:
      USERNAME: pentest-ai-debugger
      # Hostname එකට unique ID එකක් add කරනවා
      TAILSCALE_HOSTNAME: ptai-gh-${{ github.run_id }}
    steps:
      - name: Checkout pentest-ai Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pentest-ai (MCP + CLI)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate Ephemeral SSH Host Keys
        run: |
          echo ">>> Re-generating SSH host keys for this session..."
          sudo ssh-keygen -A
          echo ">>> Generating user key pair for: ${USERNAME}"
          ssh-keygen -t ed25519 -f "$HOME/.ssh/id_ed25519" -N "" -C "ptai-debug-${GITHUB_RUN_ID}"
          mkdir -p ~/.ssh
          cat "$HOME/.ssh/id_ed25519.pub" >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod 700 ~/.ssh

      - name: Start OpenSSH Server
        run: |
          echo ">>> Installing & starting OpenSSH..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      # Official Tailscale GitHub Action use කරනවා (v4)
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: ${{ env.TAILSCALE_HOSTNAME }}

      - name: Show SSH Connection Information
        run: |
          TAILSCALE_IP=$(tailscale ip -4 | head -n1)
          echo "========================================="
          echo "🔒 SSH Connection Details (SECURE - DO NOT SHARE)"
          echo "-----------------------------------------"
          echo "Tailscale IP: ${TAILSCALE_IP}"
          echo "Username: ${USERNAME}"
          echo ""
          echo "👉 Save the following private key to your local machine:"
          echo "-----------------------------------------"
          cat "$HOME/.ssh/id_ed25519"
          echo "-----------------------------------------"
          echo ""
          echo "Connect from your local machine (with Tailscale installed):"
          echo "ssh -i /path/to/saved_private_key ${USERNAME}@${TAILSCALE_IP}"
          echo ""
          if [ -n "${{ github.event.inputs.debug_target }}" ]; then
            echo "Testing connectivity to: ${{ github.event.inputs.debug_target }}"
            tailscale ping -c 3 "${{ github.event.inputs.debug_target }}" || echo "⚠️ Warning: Target may not be reachable"
          fi
          echo "========================================="
          echo "Keeping runner alive for interactive session..."
          echo "Press Ctrl+C in the Actions log to cancel and clean up."
          # IMPORTANT: Runner එක alive keep කරන command එක
          sleep infinity

  # Step 2 (Optional): CI Test Run එකක් දාන්න (Example)
  run-pentest-check:
    name: Run Basic Pentest Check (CI Mode)
    needs: connect-via-tailscale
    runs-on: ubuntu-latest
    if: false # මේ job එක දැනට disable කරලා. ඕන නම් remove කරන්න.
    steps:
      - uses: actions/checkout@v4
      - run: pip install ptai
      - name: Run Quick Audit (Example)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ptai start ${{ vars.STAGING_URL }} --ci --fail-on high --sarif pentest.sarif
