name: Full Stack - XFCE RDP + Tailscale + Ollama + AnythingLLM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      USERNAME: runner
      PASSWORD: runner
      TAILSCALE_HOSTNAME: full-stack-${{ github.run_id }}
      OLLAMA_MODEL: llama3.2:1b
      ANYTHINGLLM_PORT: 3001
      STORAGE_DIR: /home/runner/anythingllm_data

    steps:
      - uses: actions/checkout@v4

      # ---------- RDP (XFCE) ----------
      - name: Install XFCE and xrdp
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xfce4 xfce4-goodies xorg dbus-x11 xrdp
          echo "startxfce4" | sudo tee /home/${USERNAME}/.xsession
          sudo chown ${USERNAME}:${USERNAME} /home/${USERNAME}/.xsession
          sudo systemctl enable --now xrdp
          sudo systemctl restart xrdp

      - name: Set user password and sudo
        run: |
          echo "${USERNAME}:${PASSWORD}" | sudo chpasswd
          echo "${USERNAME} ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/${USERNAME}

      # ---------- Tailscale ----------
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          sudo tailscale up --authkey "${TAILSCALE_AUTHKEY}" --hostname "${TAILSCALE_HOSTNAME}"

      # ---------- Docker ----------
      - name: Install Docker
        run: |
          curl -fsSL https://get.docker.com | sudo sh
          sudo usermod -aG docker ${USERNAME}
          sudo systemctl start docker

      # ---------- Ollama (native) ----------
      - name: Install Ollama and pull model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl start ollama
          sudo systemctl enable ollama
          sleep 10
          ollama pull ${OLLAMA_MODEL}
          ollama list

      # ---------- AnythingLLM (Docker) ----------
      - name: Deploy AnythingLLM (fixed)
        run: |
          # Create storage directory with correct permissions
          sudo mkdir -p ${STORAGE_DIR}
          sudo chown -R ${USERNAME}:${USERNAME} ${STORAGE_DIR}
          
          # Remove old container if exists
          docker rm -f anythingllm 2>/dev/null || true
          
          # Run container with proper STORAGE_DIR and host access
          docker run -d \
            --name anythingllm \
            -p ${ANYTHINGLLM_PORT}:3001 \
            -e STORAGE_DIR="/app/server/storage" \
            -v ${STORAGE_DIR}:/app/server/storage \
            --add-host host.docker.internal:host-gateway \
            --restart=unless-stopped \
            mintplexlabs/anythingllm
          
          # Wait for container to start
          echo "Waiting for container to be running..."
          for i in {1..20}; do
            if docker ps | grep -q anythingllm; then
              echo "Container is running."
              break
            fi
            sleep 3
          done
          
          # Wait for HTTP endpoint
          echo "Waiting for AnythingLLM HTTP service on port ${ANYTHINGLLM_PORT}..."
          for i in {1..30}; do
            if curl -s -f -o /dev/null --max-time 5 http://localhost:${ANYTHINGLLM_PORT}; then
              echo "✓ AnythingLLM is ready (HTTP 200)"
              break
            else
              echo "Attempt $i/30: Not ready yet. Retrying in 3 seconds..."
              # Show logs every 5 attempts
              if [ $((i % 5)) -eq 0 ]; then
                echo "Recent container logs:"
                docker logs anythingllm --tail 15
              fi
              sleep 3
            fi
            if [ $i -eq 30 ]; then
              echo "❌ ERROR: AnythingLLM failed to start. Full logs:"
              docker logs anythingllm
              exit 1
            fi
          done
          
          echo "AnythingLLM last logs:"
          docker logs anythingllm --tail 10

      # ---------- Display Info ----------
      - name: Connection Information
        run: |
          TS_IP=$(sudo tailscale ip -4 | head -n1 | tr -d ' ')
          echo "============================================================"
          echo "                FULL STACK IS READY                         "
          echo "============================================================"
          echo "RDP CONNECTION:"
          echo "  Address: ${TS_IP}:3389"
          echo "  Username: ${USERNAME}"
          echo "  Password: ${PASSWORD}"
          echo ""
          echo "ANYTHINGLLM:"
          echo "  URL: http://${TS_IP}:${ANYTHINGLLM_PORT}"
          echo ""
          echo "OLLAMA (local LLM):"
          echo "  API: http://${TS_IP}:11434"
          echo "  Pre‑loaded model: ${OLLAMA_MODEL}"
          echo ""
          echo "Inside AnythingLLM, add Ollama:"
          echo "  Settings → LLM Preference → Ollama"
          echo "  Base URL: http://host.docker.internal:11434"
          echo "  Model: ${OLLAMA_MODEL}"
          echo ""
          echo "Workflow will stay alive until you cancel it."
          echo "============================================================"

      # ---------- Keep Alive ----------
      - name: Keep Runner Alive
        run: while true; do sleep 600; done
