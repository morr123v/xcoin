name: Windows Server 2022 + RDP + Tailscale + AnythingLLM + Ollama (Fixed)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-windows:
    runs-on: windows-latest
    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      RDP_USER: runner
      RDP_PASS: runner
      TAILSCALE_HOSTNAME: win-anythingllm-${{ github.run_id }}
      OLLAMA_MODEL: llama3.2:1b
      ANYTHINGLLM_PORT: 3001
      STORAGE_LOCATION: C:\anythingllm_data

    steps:
      - uses: actions/checkout@v4

      - name: Create local user and enable RDP
        shell: powershell
        run: |
          # Create local user if it doesn't exist
          $username = "$env:RDP_USER"
          $password = ConvertTo-SecureString "$env:RDP_PASS" -AsPlainText -Force
          try {
            Get-LocalUser -Name $username -ErrorAction Stop | Out-Null
            Write-Host "User $username already exists. Setting password..."
            Set-LocalUser -Name $username -Password $password
          } catch {
            Write-Host "Creating new user $username..."
            New-LocalUser -Name $username -Password $password -FullName "RDP User" -Description "User for RDP access" -PasswordNeverExpires -AccountNeverExpires
          }
          # Add user to Remote Desktop Users and Administrators groups
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          Add-LocalGroupMember -Group "Administrators" -Member $username
          
          # Enable RDP reg key
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Type DWord -Force
          # Allow RDP through firewall
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          # Allow unauthenticated connections (optional, for older clients)
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Type DWord -Force
          # Restart RDP service
          Restart-Service TermService -Force
          Write-Host "RDP enabled. User $username can now connect."

      - name: Install Tailscale
        shell: powershell
        run: |
          curl -fsSL -o tailscale.exe https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe
          Start-Process -Wait -FilePath .\tailscale.exe -ArgumentList "/S"
          Start-Sleep -Seconds 10
          tailscale up --authkey "$env:TAILSCALE_AUTHKEY" --hostname "$env:TAILSCALE_HOSTNAME"

      - name: Install Docker Desktop
        shell: powershell
        run: |
          Write-Host "Downloading Docker Desktop installer..."
          Invoke-WebRequest -Uri "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe" -OutFile "docker-installer.exe"
          Write-Host "Installing Docker Desktop silently (this may take several minutes)..."
          Start-Process -Wait -FilePath .\docker-installer.exe -ArgumentList "install", "--quiet", "--accept-license"
          # Wait for Docker daemon to be ready (up to 3 minutes)
          $maxAttempts = 36
          $attempt = 0
          $dockerReady = $false
          while ($attempt -lt $maxAttempts -and -not $dockerReady) {
            $attempt++
            try {
              docker info 2>$null
              if ($LASTEXITCODE -eq 0) {
                $dockerReady = $true
                Write-Host "Docker is ready after $attempt attempts."
              } else {
                Write-Host "Attempt $attempt : Docker not ready yet. Waiting 5 seconds..."
                Start-Sleep -Seconds 5
              }
            } catch {
              Write-Host "Attempt $attempt : Docker not ready yet. Waiting 5 seconds..."
              Start-Sleep -Seconds 5
            }
          }
          if (-not $dockerReady) {
            Write-Host "WARNING: Docker did not become ready within timeout. Trying to start Docker Desktop manually..."
            & 'C:\Program Files\Docker\Docker\Docker Desktop.exe'
            Start-Sleep -Seconds 30
          }

      - name: Run Ollama in Docker container
        shell: powershell
        run: |
          docker run -d --name ollama -p 11434:11434 --restart unless-stopped ollama/ollama
          Start-Sleep -Seconds 10
          docker exec ollama ollama pull $env:OLLAMA_MODEL
          Write-Host "Ollama container running with model $env:OLLAMA_MODEL"

      - name: Deploy AnythingLLM (with STORAGE_DIR fix)
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "$env:STORAGE_LOCATION"
          docker rm -f anythingllm 2>$null
          docker run -d `
            -p "$env:ANYTHINGLLM_PORT`:3001" `
            -e STORAGE_DIR="/app/server/storage" `
            -v "$env:STORAGE_LOCATION`:/app/server/storage" `
            --name anythingllm `
            --restart unless-stopped `
            mintplexlabs/anythingllm
          Write-Host "AnythingLLM container started on port $env:ANYTHINGLLM_PORT"
          for ($i=1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:$env:ANYTHINGLLM_PORT" -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "AnythingLLM is ready!"
                break
              }
            } catch {
              Write-Host "Attempt $i/30: HTTP not ready yet. Retrying in 5 seconds..."
            }
            Start-Sleep -Seconds 5
          }
          Write-Host "AnythingLLM logs:"
          docker logs anythingllm --tail 20

      - name: Display Connection Information
        shell: powershell
        run: |
          $TS_IP = (tailscale ip -4) -join "`n" | Out-String
          $TS_IP = $TS_IP.Trim()
          Write-Host "============================================================"
          Write-Host "     WINDOWS SERVER 2022 + ANYTHINGLLM + OLLAMA            "
          Write-Host "============================================================"
          Write-Host "RDP CONNECTION:"
          Write-Host "  Address: ${TS_IP}:3389"
          Write-Host "  Username: $env:RDP_USER"
          Write-Host "  Password: $env:RDP_PASS"
          Write-Host ""
          Write-Host "ANYTHINGLLM:"
          Write-Host "  URL: http://${TS_IP}:$env:ANYTHINGLLM_PORT"
          Write-Host ""
          Write-Host "OLLAMA (local LLM):"
          Write-Host "  API: http://${TS_IP}:11434"
          Write-Host "  Model: $env:OLLAMA_MODEL"
          Write-Host ""
          Write-Host "Inside AnythingLLM, configure Ollama as:"
          Write-Host "  Base URL: http://host.docker.internal:11434"
          Write-Host "  Model: $env:OLLAMA_MODEL"
          Write-Host ""
          Write-Host "Workflow will keep running until cancelled."
          Write-Host "============================================================"

      - name: Keep Runner Alive
        shell: powershell
        run: |
          while ($true) {
            Start-Sleep -Seconds 600
          }
